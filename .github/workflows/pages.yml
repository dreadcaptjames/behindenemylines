name: Publish Behind Enemy Lines
on:
  push:
    branches: [main]
    paths:
      - 'Helldivers_Behind_Enemy_Lines_v*.zip'
      - 'mobile/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out archived releases
        uses: actions/checkout@v6

      - name: Extract latest complete browser build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          releases=(Helldivers_Behind_Enemy_Lines_v*.zip)
          if (( ${#releases[@]} == 0 )); then
            echo "::error::Upload a complete Helldivers_Behind_Enemy_Lines_v*.zip to the repository root first."
            exit 1
          fi
          latest="$(printf '%s\n' "${releases[@]}" | sort -V | tail -n 1)"
          echo "Publishing release: $latest"
          mkdir -p _unpacked _site
          unzip -q "$latest" -d _unpacked
          browser_index="$(find _unpacked -type f -path '*/browser-demo/index.html' -print -quit)"
          if [[ -z "$browser_index" ]]; then
            echo "::error::The ZIP does not contain browser-demo/index.html."
            exit 1
          fi
          game_root="$(dirname "$(dirname "$browser_index")")"
          for asset_dir in art audio browser-demo; do
            if [[ ! -d "$game_root/$asset_dir" ]]; then
              echo "::error::Missing $asset_dir directory in the complete release ZIP."
              exit 1
            fi
            cp -a "$game_root/$asset_dir" _site/
          done
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en"><head><meta charset="utf-8">' \
            '<meta name="viewport" content="width=device-width, initial-scale=1">' \
            '<meta http-equiv="refresh" content="0; url=./browser-demo/index.html">' \
            '<title>Behind Enemy Lines</title></head>' \
            '<body><a href="./browser-demo/index.html">Play Behind Enemy Lines</a></body></html>' \
            > _site/index.html
          touch _site/.nojekyll
          test -f _site/browser-demo/index.html
          # Mobile controls live as editable source files alongside the release ZIP.
          # Older ZIP archives remain unmodified and fully recoverable.
          if [[ -f mobile/touch-controls.js && -f mobile/touch-controls.css ]]; then
            mkdir -p _site/mobile
            cp mobile/touch-controls.js mobile/touch-controls.css _site/mobile/
            python3 - <<'PY'
          from pathlib import Path
          page = Path("_site/browser-demo/index.html")
          content = page.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="../mobile/touch-controls.css">'
          js = '<script src="../mobile/touch-controls.js"></script>'
          if css not in content:
              content = content.replace("</head>", css + "\n</head>", 1)
          if js not in content:
              content = content.replace("</body>", js + "\n</body>", 1)
          content = content.replace("v1.0.1", "v1.0.2").replace("BUILD 1.0.1", "BUILD 1.0.2")
          desktop_hint = "panel('WASD MOVE  •  MOUSE FIRE  •  SPACE JUMP  •  E USE',35,76)"
          mobile_hint = "panel(document.body.classList.contains('bel-touch-on')?'D-PAD MOVE  •  AIM + FIRE  •  JUMP  •  USE':'WASD MOVE  •  MOUSE FIRE  •  SPACE JUMP  •  E USE',35,76)"
          content = content.replace(desktop_hint, mobile_hint)
          page.write_text(content, encoding="utf-8")
          PY
          fi
          echo "Browser game staged successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy browser game
        id: deployment
        uses: actions/deploy-pages@v4
